name: release

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Exact package version to build (without v)"
        required: true
        type: string
      publish:
        description: "Publish GitHub Release assets and npm package"
        required: true
        default: false
        type: boolean
      prerelease:
        description: "Mark a manual publication as a prerelease"
        required: true
        default: true
        type: boolean
      ref:
        description: "Release tag/ref to build; required for recovering an existing release"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  release-please:
    if: github.event_name == 'push' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # Deliberately GITHUB_TOKEN: tags and releases created with it do
          # NOT trigger the v*.*.* push run, so publication happens only
          # through publish-release-please below. Creating the tag with a PAT
          # would also fire publish-tag and race a second publish pipeline
          # under a different concurrency key.
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Dispatch checks for the release PR
        id: release_pr
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_JSON: ${{ steps.release.outputs.pr }}
          PRS_JSON: ${{ steps.release.outputs.prs }}
        shell: bash
        run: |
          pr_number="$(
            jq -r 'if type == "object" then (.number // empty) else empty end' <<<"$PR_JSON" 2>/dev/null ||
              true
          )"
          if [ -z "$pr_number" ]; then
            pr_number="$(
              jq -r 'if type == "array" then (.[0].number // empty) else empty end' <<<"${PRS_JSON:-[]}" 2>/dev/null ||
                true
            )"
          fi
          if [ -z "$pr_number" ]; then
            pr_number="$(
              gh pr list \
                --repo "${{ github.repository }}" \
                --base "${{ github.ref_name }}" \
                --state open \
                --json number,headRefName \
                --jq '.[] | select(.headRefName | startswith("release-please--branches--")) | .number' |
                head -n 1
            )"
          fi
          if [ -z "$pr_number" ]; then
            echo "Release Please reported a PR update, but no open release PR was found." >&2
            exit 1
          fi

          head_branch="$(
            gh pr view "$pr_number" \
              --repo "${{ github.repository }}" \
              --json headRefName \
              --jq .headRefName
          )"
          if [ -z "$head_branch" ]; then
            echo "Release PR #$pr_number has no head branch." >&2
            exit 1
          fi

          gh workflow run ci.yml --repo "${{ github.repository }}" --ref "$head_branch"
          gh workflow run release-pr-validation.yml --repo "${{ github.repository }}" --ref "$head_branch"
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "head_branch=$head_branch" >> "$GITHUB_OUTPUT"
      - name: Enable auto-merge on the release PR
        if: ${{ steps.release_pr.outputs.number != '' }}
        env:
          # A fine-grained PAT (contents + pull requests read/write). Only the
          # auto-merge enablement uses it: the eventual merge is then
          # attributed to the PAT owner, so the push to main triggers this
          # workflow again and release-please tags the release.
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          PR_NUMBER: ${{ steps.release_pr.outputs.number }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "RELEASE_PLEASE_TOKEN secret is not configured; skipping auto-merge." >&2
            exit 0
          fi
          gh pr merge --auto --merge "$PR_NUMBER" --repo "${{ github.repository }}"

  validate:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/build-release.yml
    with:
      version: ""
      publish: false
      prerelease: false
      ref: ${{ github.sha }}

  publish-tag:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/publish.yml
    with:
      version: ""
      publish: true
      prerelease: ${{ contains(github.ref_name, '-') }}
      ref: ${{ github.ref }}

  publish-release-please:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/publish.yml
    with:
      version: ${{ needs.release-please.outputs.version }}
      publish: true
      prerelease: false
      ref: v${{ needs.release-please.outputs.version }}

  manual:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/publish.yml
    with:
      version: ${{ inputs.version }}
      publish: ${{ inputs.publish }}
      prerelease: ${{ inputs.prerelease }}
      ref: ${{ inputs.ref || github.sha }}
