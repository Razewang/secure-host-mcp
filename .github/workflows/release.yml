name: release

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Exact package version to build (without v)"
        required: true
        type: string
      publish:
        description: "Publish GitHub Release assets and npm package"
        required: true
        default: false
        type: boolean
      prerelease:
        description: "Mark a manual publication as a prerelease"
        required: true
        default: true
        type: boolean
      ref:
        description: "Release tag/ref to build; required for recovering an existing release"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  release-please:
    if: github.event_name == 'push' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # Deliberately GITHUB_TOKEN: tags and releases created with it do
          # NOT trigger the v*.*.* push run, so publication happens only
          # through publish-release-please below. Creating the tag with a PAT
          # would also fire publish-tag and race a second publish pipeline
          # under a different concurrency key.
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Resolve the release PR
        id: release_pr
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_JSON: ${{ steps.release.outputs.pr }}
          PRS_JSON: ${{ steps.release.outputs.prs }}
        shell: bash
        run: |
          pr_number="$(
            jq -r 'if type == "object" then (.number // empty) else empty end' <<<"$PR_JSON" 2>/dev/null ||
              true
          )"
          if [ -z "$pr_number" ]; then
            pr_number="$(
              jq -r 'if type == "array" then (.[0].number // empty) else empty end' <<<"${PRS_JSON:-[]}" 2>/dev/null ||
                true
            )"
          fi
          if [ -z "$pr_number" ]; then
            pr_number="$(
              gh pr list \
                --repo "${{ github.repository }}" \
                --base "${{ github.ref_name }}" \
                --state open \
                --json number,headRefName \
                --jq '.[] | select(.headRefName | startswith("release-please--branches--")) | .number' |
                head -n 1
            )"
          fi
          if [ -z "$pr_number" ]; then
            echo "Release Please reported a PR update, but no open release PR was found." >&2
            exit 1
          fi

          head_sha="$(
            gh pr view "$pr_number" \
              --repo "${{ github.repository }}" \
              --json headRefOid \
              --jq .headRefOid
          )"
          if [ -z "$head_sha" ]; then
            echo "Release PR #$pr_number has no head commit." >&2
            exit 1
          fi

          echo "number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
      - name: Approve checks and enable auto-merge on the release PR
        if: ${{ steps.release_pr.outputs.number != '' }}
        env:
          # A fine-grained PAT with Actions, contents, and pull requests
          # read/write. It approves the pull_request workflows that GitHub
          # holds for GITHUB_TOKEN-created PRs, then enables auto-merge. The
          # release-please action itself must continue using GITHUB_TOKEN.
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          HEAD_SHA: ${{ steps.release_pr.outputs.head_sha }}
          PR_NUMBER: ${{ steps.release_pr.outputs.number }}
        shell: bash
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "RELEASE_PLEASE_TOKEN secret is not configured; skipping check approval and auto-merge." >&2
            exit 0
          fi

          runs_json="[]"
          for attempt in {1..15}; do
            runs_json="$(
              gh run list \
                --repo "${{ github.repository }}" \
                --commit "$HEAD_SHA" \
                --event pull_request \
                --limit 20 \
                --json databaseId,name,status,conclusion
            )"
            ci_run="$(
              jq -r '[.[] | select(.name == "ci")][0].databaseId // empty' <<<"$runs_json"
            )"
            release_run="$(
              jq -r '[.[] | select(.name == "release")][0].databaseId // empty' <<<"$runs_json"
            )"
            if [ -n "$ci_run" ] && [ -n "$release_run" ]; then
              break
            fi
            sleep 2
          done

          if [ -z "${ci_run:-}" ] || [ -z "${release_run:-}" ]; then
            echo "The pull_request validation runs for release PR #$PR_NUMBER were not created in time." >&2
            exit 1
          fi

          for run_id in "$ci_run" "$release_run"; do
            conclusion="$(
              jq -r --argjson id "$run_id" \
                '.[] | select(.databaseId == $id) | .conclusion' <<<"$runs_json"
            )"
            if [ "$conclusion" = "action_required" ]; then
              gh api \
                --method POST \
                "repos/${{ github.repository }}/actions/runs/$run_id/approve"
            fi
          done

          gh pr merge --auto --merge "$PR_NUMBER" --repo "${{ github.repository }}"

  validate:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/build-release.yml
    with:
      version: ""
      publish: false
      prerelease: false
      ref: ${{ github.sha }}

  publish-tag:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/publish.yml
    with:
      version: ""
      publish: true
      prerelease: ${{ contains(github.ref_name, '-') }}
      ref: ${{ github.ref }}

  publish-release-please:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/publish.yml
    with:
      version: ${{ needs.release-please.outputs.version }}
      publish: true
      prerelease: false
      ref: v${{ needs.release-please.outputs.version }}

  manual:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/publish.yml
    with:
      version: ${{ inputs.version }}
      publish: ${{ inputs.publish }}
      prerelease: ${{ inputs.prerelease }}
      ref: ${{ inputs.ref || github.sha }}
